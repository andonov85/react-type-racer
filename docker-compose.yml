version: "3.8"
services:
  react-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: react-type-racer-container
    stdin_open: true
    ports:
      - 3000:3000
    volumes:
      - ./:/home/node/app:z
      - /home/node/app/node_modules
    environment:
      - NODE_ENV=development
    user: node
    command: npm start